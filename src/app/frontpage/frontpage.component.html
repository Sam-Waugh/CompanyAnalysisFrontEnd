<mat-card-header class="page-header">
<div class="header-container">
  <h1 class="discover-heading">Discover Your Next Read</h1>
</div>
</mat-card-header>
<main>
<mat-card class="feedback-container">
    <h2>Help Us Personalise Your Feed</h2>
    <p>What type of articles do you enjoy?</p>
    <div class="feedback-options">
      <button mat-button (click)="logFeedback('Technology')">Technology</button>
      <button mat-button (click)="logFeedback('Business')">Business</button>
      <button mat-button (click)="logFeedback('Science')">Science</button>
      <button mat-button (click)="logFeedback('Entertainment')">Entertainment</button>
    </div>
  </mat-card>
<mat-sidenav-container class="container">
  <!-- Main Content (Article Feed) -->
  <mat-sidenav-content class="feed-container">
    <h3>Personalised Articles</h3>  

  <mat-card *ngFor="let article of articles" (click)="viewArticle(article, userId, sessionId)" style="cursor: pointer;">
    <mat-card-header>
        <mat-card-title style="text-align: left;">{{ article.title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{ article.excerpt }}</p>
    </mat-card-content>
    <!-- <mat-divider></mat-divider> -->
    <!-- <mat-card-actions>
      <button mat-button>Read More</button>
    </mat-card-actions> -->
  </mat-card>

  </mat-sidenav-content>

    <!-- Sidebar (Quizzes) -->
  <mat-sidenav mode="side" position="end" opened class="quiz-sidebar">
    <h2>Fun Quizzes 🎉</h2>

    <div *ngIf="quizzes.length === 0">
      <p>No quizzes available at the moment.</p>
    </div>
    <div *ngIf="quizzes.length > 0">
      <div *ngFor="let quiz of quizzes">
        <mat-card>
          <mat-card-header>
            <mat-card-title>{{ quiz.question }}</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <button mat-button *ngFor="let option of quiz.options" (click)="submitQuizAnswer({ 
              quiz_question: quiz.question, 
              quiz_options: quiz.options.join(', '), 
              selected_value: option 
            }, userId, sessionId)">
              {{ option }}
            </button>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
</main>
