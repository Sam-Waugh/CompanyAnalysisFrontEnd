<mat-card-header class="page-header">
  <div class="header-container">
    <div class="header-inner">
    <div class="logo">
      <img src="../../assets/curatomatic-logo.png" alt="CuratoMatic Logo" class="logo-img">
    </div>
    <a href="https://github.com/Sam-Waugh/CompanyAnalysisFrontEnd" target="_blank" class="github-link">
      View Code on GitHub
    </a>
    </div>
  </div>
</mat-card-header>

  </div>
</mat-card-header> -->
<main class="reddit-style">

  <mat-card class="chatbot-container" (click)="openChatbotModal()">
    <div class="chatbot-modal-trigger">
      <h2>Can't find any articles to your taste? Chat to us and let us know what you'd like us to write about</h2>
    </div>
  </mat-card>

  <mat-sidenav-container class="container">
    <!-- Main Content (Article Feed) -->
    <mat-sidenav-content class="feed-container">
      <h3>Personalised Articles</h3>  

      <mat-card *ngFor="let article of articles" class="post-card" (click)="viewArticle(article, userId, sessionId)">
        <div *ngIf="article.isUnread" class="new-badge">NEW</div>
        <mat-card-header class="post-header">
          <!-- Left: Article title -->
          <div class="post-title">
            <mat-card-title>{{ article.title }}</mat-card-title>
          </div>
          <!-- Right: Author info -->
          <div class="post-author">
            <img *ngIf="article.author_photo_path" [src]="article.author_photo_path" [alt]="article.author_name">
            <span *ngIf="article.author_name">{{ article.author_name }}</span>
          </div>
        </mat-card-header>
        <mat-card-content>
          <p>{{ article.excerpt }}</p>
        </mat-card-content>
      </mat-card>

    </mat-sidenav-content>

    <!-- Sidebar (Quizzes) -->
    <mat-sidenav mode="side" position="end" opened class="quiz-sidebar">
      <h2>Fun Quizzes 🎉</h2>
      <div *ngIf="quizzes.length === 0">
        <p>No quizzes available at the moment.</p>
      </div>
      <div *ngIf="quizzes.length > 0">
        <div *ngFor="let quiz of quizzes">
          <mat-card class="quiz-card">
            <mat-card-header>
              <mat-card-title>{{ quiz.question }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <button mat-button *ngFor="let option of quiz.options" (click)="submitQuizAnswer({ 
                quiz_question: quiz.question, 
                quiz_options: quiz.options.join(', '), 
                selected_value: option 
              }, userId, sessionId)">
                {{ option }}
              </button>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </mat-sidenav>
  </mat-sidenav-container>
</main>
