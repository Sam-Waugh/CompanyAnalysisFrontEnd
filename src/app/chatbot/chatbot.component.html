<main class="main">
  <div class="content">
    <h2>{{ prompt }}</h2>

    <div class="chatbot-container">
      <!-- Loading Indicator -->
      <div *ngIf="isLoading" class="loading">Loading...</div>

      <div class="author-selection" style="margin-bottom: 16px;">
      <mat-form-field appearance="fill" style="width: 100%;">
        <mat-label>Select Author</mat-label>
        <mat-select [(ngModel)]="selectedAuthorId">
          <mat-option *ngFor="let author of authors" [value]="author.id">
            <div style="display: flex; align-items: center;">
              <!-- Author photo -->
              <img [src]="author.author_photo_path" 
                  alt="{{ author.author_name }}" 
                  style="width:40px; height:40px; object-fit: cover; margin-right: 12px;">
              <!-- Text container for name and description -->
              <div>
                <!-- Name in bold -->
                <div style="font-weight: bold;">{{ author.author_name }}</div>
                <!-- Description left aligned -->
                <div style="text-align: left;">{{ author.author_description }}</div>
              </div>
            </div>
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

      <!-- Chatbot Question and User Input -->
      <div *ngIf="!isCompleted && !isLoading">
        <mat-card appearance="outlined">
          <mat-card-header><h3>Chatbot:</h3></mat-card-header>
          <mat-card-content>
            <p>{{ currentQuestion }}</p>
            <input [(ngModel)]="userResponse" type="text" placeholder="Type your response here" [disabled]="!currentQuestion || isLoading" 
            style="width: 80%; height: 50px; font-size: 16px; padding: 8px;"/>
          </mat-card-content>
        </mat-card>
        <button (click)="submitResponse(userResponse)" [disabled]="!userResponse.trim()">Submit</button>
      </div>

      <!-- Chat History -->
      <div *ngIf="chatHistory.length > 0" class="chat-history">
        <mat-card appearance="outlined">
          <mat-card-header><h3>Chat History</h3></mat-card-header>
          <mat-card-content>
            <div *ngFor="let chat of chatHistory">
              <p><strong>Chatbot:</strong> {{ chat.question }}</p>
              <p><strong>You:</strong> {{ chat.answer }}</p>
              <hr />
            </div>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
    </div>

    <div class="divider" role="separator" aria-label="Divider"></div>
  </div>
</main>
