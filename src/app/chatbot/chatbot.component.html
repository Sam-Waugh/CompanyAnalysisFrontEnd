<main class="reddit-chatbot">
  <div class="chatbot-content">
    <h2 class="chatbot-prompt">{{ prompt }}</h2>
    <mat-card class="chatbot-card">
      <!-- Loading Indicator -->
      <div *ngIf="isLoading" class="loading">Loading...</div>

      <!-- Author Selection -->
      <div class="author-selection" *ngIf="!isLoading">
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Select Author</mat-label>
          <mat-select [(ngModel)]="selectedAuthorId">
            <mat-select-trigger>
              {{ selectedAuthor?.author_name || 'Select Author' }}
            </mat-select-trigger>
            <mat-option *ngFor="let author of authors" [value]="author.id">
              <div class="author-option">
                <img class="author-photo" [src]="author.author_photo_path" alt="{{ author.author_name }}" class="author-photo">
                <div class="author-text">
                  <div class="author-name">{{ author.author_name }}</div>
                  <div class="author-description">{{ author.author_description }}</div>
                </div>
              </div>
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Chat Input Area -->
      <div *ngIf="!isCompleted && !isLoading" class="chat-input-area">
        <mat-card class="chat-input-card">
          <mat-card-header>
            <h3 class="chat-header">Chatbot:</h3>
          </mat-card-header>
          <mat-card-content>
            <p class="chat-question">{{ currentQuestion }}</p>
            <input [(ngModel)]="userResponse" type="text" placeholder="Type your response here" class="chat-input" [disabled]="!currentQuestion || isLoading" />
          </mat-card-content>
        </mat-card>
        <button class="chat-submit-button" (click)="submitResponse(userResponse)" [disabled]="!userResponse.trim()">Submit</button>
      </div>

      <!-- Chat History -->
      <div *ngIf="chatHistory.length > 0" class="chat-history">
        <mat-card class="chat-history-card">
          <mat-card-header>
            <h3 class="history-header">Chat History</h3>
          </mat-card-header>
          <mat-card-content>
            <div *ngFor="let chat of chatHistory" class="chat-entry">
              <p><strong>Chatbot:</strong> {{ chat.question }}</p>
              <p><strong>You:</strong> {{ chat.answer }}</p>
              <hr />
            </div>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    </mat-card>
    <div class="divider" role="separator" aria-label="Divider"></div>
  </div>
</main>
