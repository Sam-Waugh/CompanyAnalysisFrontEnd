<div class="chatbot-container">
  <textarea
    [(ngModel)]="userInput"
    placeholder="Type your question here..."
    rows="4"
    cols="50"
  ></textarea>
  <button (click)="onSubmit()" [disabled]="isLoading || !userInput.trim()">Ask</button>

  <div *ngIf="isLoading">Loading...</div>
  <div *ngIf="chatResponse && !isLoading">
    <mat-card appearance="outlined" class="json-card">
    <mat-card-header><h3>Response:</h3></mat-card-header>
    <mat-card-content>
    {{ chatResponse | json }}
    </mat-card-content>
    <mat-card-footer></mat-card-footer>
    </mat-card>
  </div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
</div>
