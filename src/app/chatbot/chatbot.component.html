<main class="main">
  <div class="content">
    <h2>{{ prompt }}</h2>

    <div class="chatbot-container">
      <!-- Loading Indicator -->
      <div *ngIf="isLoading" class="loading">Loading...</div>

      <!-- Chatbot Question and User Input -->
      <div *ngIf="!isCompleted && !isLoading">
        <mat-card appearance="outlined">
          <mat-card-header><h3>Chatbot:</h3></mat-card-header>
          <mat-card-content>
            <p>{{ currentQuestion }}</p>
            <input [(ngModel)]="userResponse" type="text" placeholder="Type your response here" [disabled]="!currentQuestion || isLoading" 
            style="width: 80%; height: 50px; font-size: 16px; padding: 8px;"/>
          </mat-card-content>
        </mat-card>
        <button (click)="submitResponse(userResponse)" [disabled]="!userResponse.trim()">Submit</button>
      </div>

      <!-- Generated Report -->
      <div *ngIf="isCompleted">
        <h3>Generated Report</h3>
        <mat-card appearance="outlined">
          <mat-card-content>
            <h4>{{ finalResponse?.llm_response?.title }}</h4>
            <h5>{{ finalResponse?.llm_response?.excerpt }}</h5>
            <!-- If full_article contains HTML or markdown that you want rendered as HTML -->
            <div [innerHTML]="finalResponse?.llm_response?.full_article"></div>
          </mat-card-content>
        </mat-card>

        <!-- Download Format Selection -->
        <div>
          <label for="download-format">Choose download format: </label>
          <select id="download-format" [(ngModel)]="selectedFormat">
            <option value="txt">Text (.txt)</option>
            <option value="pdf">PDF (.pdf)</option>
          </select>
        </div>

        <!-- Download Report Button -->
        <button mat-raised-button (click)="downloadReport()">Download Report</button>

        <!-- Feedback Section -->
        <div *ngIf="isFeedbackStage">
          <mat-card appearance="outlined">
            <mat-card-header><h3>Feedback</h3></mat-card-header>
            <mat-card-content>
              <textarea [(ngModel)]="feedback" placeholder="Provide your feedback..."></textarea>
              <button (click)="submitFeedback()">Submit Feedback</button>
            </mat-card-content>
          </mat-card>
        </div>
      </div>

      <!-- Chat History -->
      <div *ngIf="chatHistory.length > 0" class="chat-history">
        <mat-card appearance="outlined">
          <mat-card-header><h3>Chat History</h3></mat-card-header>
          <mat-card-content>
            <div *ngFor="let chat of chatHistory">
              <p><strong>Chatbot:</strong> {{ chat.question }}</p>
              <p><strong>You:</strong> {{ chat.answer }}</p>
              <hr />
            </div>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
    </div>

    <div class="divider" role="separator" aria-label="Divider"></div>
  </div>
</main>
