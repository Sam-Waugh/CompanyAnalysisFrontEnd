<!-- Built using Angular Material documentation: https://material.angular.dev/components/categories, and Angular Dev documentation: https://angular.dev/api/common -->
<h2 mat-dialog-title class="article-title">{{ data.article.title }}</h2>
<mat-dialog-content class="article-content" #contentContainer>
  <!-- Article Image -->
  <div class="article-image-container">
    <img [src]="data.article.article_image" [alt]="data.article.title" class="article-image" />
  </div>

  <!-- Full Article -->
  <div class="full-article" *ngIf="isString(data.article.full_article); else objectArticle">
    <div [innerHTML]="removeTitleTags(data.article.full_article)"></div>
  </div>
  <ng-template #objectArticle>
    <div *ngFor="let section of data.article.full_article | keyvalue" class="article-section">
      <h3 class="section-title">{{ formatKey(section.key) | titlecase }}</h3>
      <div [innerHTML]="getSectionContent(section.value)"></div>
    </div>
  </ng-template>

  <!-- Author Info -->
  <div class="author-info">
    <img [src]="data.article.author_photo_path" [alt]="data.article.author_name" class="author-photo" />
    <span class="author-name">Author: {{ data.article.author_name }}</span>
  </div>

  <!-- Personal Explanation -->
  <div class="personal-explanation">
    <h3 class="explanation-title">Personal Explanation</h3>
    <p>{{ data.article.personal_explanation }}</p>
  </div>

  <!-- Feedback Section -->
  <h3 class="feedback-title">Give Your Feedback</h3>
  <!-- Star Rating -->
  <div class="star-rating">
    <span class="star-label">Star Rating:</span>
    <ng-container *ngFor="let star of [1, 2, 3, 4, 5]">
      <mat-icon class="star-icon" (click)="setStarRating(star)">
        {{ star <= (feedback.starRating ?? 0) ? 'star' : 'star_border' }}
      </mat-icon>
    </ng-container>
  </div>
  <!-- Emoticon Reactions -->
  <div class="emoticon-reactions">
    <button mat-button (click)="setReaction('love')" [class.selected]="feedback.reaction === 'love'">😍 Love</button>
    <button mat-button (click)="setReaction('insightful')" [class.selected]="feedback.reaction === 'insightful'">💡 Insightful</button>
    <button mat-button (click)="setReaction('boring')" [class.selected]="feedback.reaction === 'boring'">😒 Boring</button>
    <button mat-button (click)="setReaction('rubbish')" [class.selected]="feedback.reaction === 'rubbish'">🤮 Rubbish</button>
  </div>
  <!-- Written Feedback -->
  <mat-form-field appearance="fill" class="feedback-comments">
    <mat-label>Written Feedback</mat-label>
    <textarea matInput [(ngModel)]="feedback.comments"></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" (click)="onSubmitFeedback()">Submit Feedback</button>
</mat-dialog-actions>
